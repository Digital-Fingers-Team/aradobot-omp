# Serve OMP under the /omp path as well as at the root.
#
# PKP 3.5 ignores config.inc.php's base_url for web requests: PKPRequest::
# getBaseUrl() auto-detects from the Host header plus getBasePath(), which is
# derived from SCRIPT_NAME. Behind the aradobot proxy OMP is published at
# http://<host>:4000/omp, so Apache has to see /omp/index.php for the generated
# links to carry the prefix.
Alias /omp /var/www/html
