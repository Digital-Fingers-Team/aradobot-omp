services:
  omp-db:
    image: docker.io/library/mariadb:10.11
    container_name: omp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${OMP_DB_ROOT_PASSWORD:?set in .env}"
      MYSQL_DATABASE: "${OMP_DB_NAME:-omp}"
      MYSQL_USER: "${OMP_DB_USER:-omp}"
      MYSQL_PASSWORD: "${OMP_DB_PASSWORD:?set in .env}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - omp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  omp-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/aradobot_omp:latest
    container_name: omp-app
    restart: unless-stopped
    depends_on:
      omp-db:
        condition: service_healthy
    environment:
      OMP_BASE_URL: "${OMP_BASE_URL:?set in .env}"
      OMP_INSTALLED: "${OMP_INSTALLED:-Off}"
      OMP_APP_KEY: "${OMP_APP_KEY:?set in .env}"
      OMP_SALT: "${OMP_SALT:?set in .env}"
      OMP_DB_DRIVER: "${OMP_DB_DRIVER:-mysqli}"
      OMP_DB_HOST: "${OMP_DB_HOST:-omp-db}"
      OMP_DB_USER: "${OMP_DB_USER:-omp}"
      OMP_DB_PASSWORD: "${OMP_DB_PASSWORD:?set in .env}"
      OMP_DB_NAME: "${OMP_DB_NAME:-omp}"
      OMP_FILES_DIR: "${OMP_FILES_DIR:-/var/www/files}"
      OMP_SSO_SECRET: "${OMP_SSO_SECRET:?must match aradobot .env}"
      OMP_API_KEY_SECRET: "${OMP_API_KEY_SECRET:?set in .env}"
    ports:
      - "8091:80"
    volumes:
      - omp-files:/var/www/files
      - ./apache-omp-prefix.conf:/etc/apache2/conf-enabled/omp-prefix.conf:ro,Z
      - ./header-override.tpl:/var/www/html/templates/frontend/components/header.tpl:ro,Z
      - ./backend-override.tpl:/var/www/html/lib/pkp/templates/layouts/backend.tpl:ro,Z

volumes:
  omp-db-data:
    name: omp-db-data
  omp-files:
    name: omp-files
